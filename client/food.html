<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>식단 관리 - YamYam</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Gowun+Batang:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/food/food.css" />
    <script src="./js/food/food.js"></script>
  </head>
  <body>
    <div class="app-container">
      <!-- TOP NAV -->
      <nav class="icon-sidebar">
        <a href="index.html" class="nav-logo"
          >YamYam<span class="nav-logo-dot"></span
        ></a>
        <div class="sidebar-icons">
          <a href="user.html" class="sidebar-icon" data-tooltip="마이페이지">
            <i class="fa-regular fa-user"></i>
            <span class="nav-active-dot"></span>
          </a>
          <a
            href="food.html"
            class="sidebar-icon active"
            data-tooltip="식단 관리"
          >
            <i class="fa-solid fa-bowl-food"></i>
            <span class="nav-active-dot"></span>
          </a>
          <a href="challenge.html" class="sidebar-icon" data-tooltip="챌린지">
            <i class="fa-solid fa-arrow-up-right-dots"></i>
            <span class="nav-active-dot"></span>
          </a>
        </div>
      </nav>

      <!-- CONTENT ROW -->
      <div style="display: flex; flex: 1; overflow: hidden">
        <!-- ── SECONDARY SIDEBAR ── -->
        <aside class="secondary-sidebar">
          <!-- Header: title + date nav -->
          <div class="sidebar-zone-header">
            <h5>오늘의 식단</h5>
            <div class="date-nav">
              <button class="date-nav-btn" id="btnPrevDay">
                <i class="fa-solid fa-chevron-left"></i>
              </button>
              <input type="date" id="currentDateDisplay" title="날짜 변경" />
              <button class="date-nav-btn" id="btnNextDay">
                <i class="fa-solid fa-chevron-right"></i>
              </button>
            </div>
          </div>

          <!-- Calorie summary -->
          <div class="calorie-card">
            <div class="calorie-card-label">총 칼로리</div>
            <div>
              <span class="calorie-card-value" id="dailyTotalCalories">0</span>
              <span class="calorie-card-unit">kcal</span>
            </div>
          </div>

          <!-- Meal list -->
          <div class="sidebar-zone-list" id="mealBlocksContainer">
            <div class="sidebar-empty">
              <div class="sidebar-empty-icon">🥗</div>
              <div class="sidebar-empty-text">저장된 식단이 없어요</div>
            </div>
          </div>

          <!-- Footer: add button -->
          <div class="sidebar-zone-footer">
            <p class="sidebar-hint">식단을 선택하면 상세 정보가 나타나요</p>
            <button class="btn-add-meal" id="btnAddNewMeal">
              <i class="fa-solid fa-plus"></i> 음식 추가하기
            </button>
          </div>
        </aside>

        <!-- ── MAIN PANEL ── -->
        <main
          class="main-content page-enter d-flex"
          style="flex: 1; overflow: hidden"
        >
          <div
            id="viewDietPanel"
            class="p-4 d-flex flex-column"
            style="flex: 1; overflow-y: auto"
          >
            <div id="viewDietContent" class="panel-empty-state">
              <div class="panel-empty-icon">🍽️</div>
              <div class="panel-empty-title">식단을 선택해주세요</div>
              <div class="panel-empty-sub">
                왼쪽 목록에서 식단 카드를 클릭하세요
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- ── MODAL: 음식 추가 ── -->
    <div
      class="modal fade"
      id="addDietModal"
      tabindex="-1"
      aria-labelledby="addDietModalLabel"
      aria-hidden="true"
    >
      <div
        class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable"
      >
        <div
          class="modal-content border-0 shadow-lg"
          style="border-radius: 20px; overflow: hidden"
        >
          <div
            class="modal-header border-0"
            style="
              background: linear-gradient(135deg, #4a6028, #3d5220);
              padding: 18px 24px;
            "
          >
            <h5
              class="modal-title fw-bold text-white"
              id="addDietModalLabel"
              style="font-size: 16px"
            >
              무엇을 드셨나요? 🍽️
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body p-4 bg-white">
            <div class="row g-2 mb-4">
              <div class="col-6">
                <label
                  class="form-label fw-bold mb-1"
                  style="
                    font-size: 12px;
                    color: var(--text-muted);
                    text-transform: uppercase;
                    letter-spacing: 0.5px;
                  "
                  >식사 구분</label
                >
                <select class="form-select form-select-sm" id="dietType">
                  <option value="아침">🌅 아침</option>
                  <option value="점심">☀️ 점심</option>
                  <option value="저녁">🌙 저녁</option>
                  <option value="간식">🍪 간식</option>
                </select>
              </div>
            </div>
            <!-- ⭐ 추천 모드 선택 -->
            <label
              class="form-label fw-bold mb-2"
              style="
                font-size: 12px;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
              "
            >
              추천 모드
            </label>

            <div class="btn-group mb-3 w-100">
              <button
                class="btn btn-outline-success mode-btn active"
                data-mode="DIET"
              >
                다이어트
              </button>
              <button class="btn btn-outline-success mode-btn" data-mode="BULK">
                벌크업
              </button>
              <button class="btn btn-outline-success mode-btn" data-mode="KETO">
                키토
              </button>
              <button
                class="btn btn-outline-success mode-btn"
                data-mode="HEALTH"
              >
                건강식
              </button>
            </div>
            <label
              class="form-label fw-bold mb-2"
              style="
                font-size: 12px;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
              "
              >음식 검색</label
            >
            <div
              class="input-group mb-3"
              style="
                border-radius: 11px;
                overflow: hidden;
                border: 1.5px solid var(--border);
                box-shadow: 0 2px 8px rgba(44, 26, 0, 0.05);
              "
            >
              <input
                type="text"
                id="foodSearch"
                class="form-control border-0"
                placeholder="예: 불고기, 샐러드, 피자…"
                style="font-size: 14px; padding: 11px 16px"
              />
              <button
                class="btn text-white fw-bold px-4"
                style="
                  background: linear-gradient(135deg, #5a7230, #3d5220);
                  border: none;
                  font-family: &quot;Nunito&quot;, sans-serif;
                "
                id="btnFoodSearch"
              >
                검색
              </button>
            </div>

            <ul
              id="foodResult"
              class="list-group list-group-flush small mb-4"
              style="
                max-height: 200px;
                overflow-y: auto;
                border: 1px solid var(--border);
                border-radius: 12px;
              "
            ></ul>

            <label
              class="form-label fw-bold mb-2"
              style="
                font-size: 12px;
                color: var(--text-muted);
                text-transform: uppercase;
                letter-spacing: 0.5px;
              "
              >🛒 선택한 음식</label
            >
            <ul
              id="selectedFoods"
              class="list-group list-group-flush mb-3 small"
              style="
                border: 1px solid var(--border);
                border-radius: 12px;
                background: var(--surface-2);
                min-height: 60px;
              "
            >
              <li
                class="list-group-item text-center text-muted py-4"
                style="border: none; font-size: 13px"
              >
                선택된 음식이 없습니다.
              </li>
            </ul>

            <div
              id="stagingNutrition"
              class="d-none mb-1 p-3 rounded-3"
              style="
                background: var(--primary-bg);
                border: 1px solid rgba(188, 202, 140, 0.4);
              "
            ></div>
          </div>
          <div
            class="modal-footer border-0 pt-0"
            style="background: var(--surface-2); padding: 12px 24px 20px"
          >
            <button
              type="button"
              class="btn btn-outline-secondary"
              data-bs-dismiss="modal"
            >
              취소
            </button>
            <button
              class="btn fw-bold px-4"
              style="
                background: linear-gradient(135deg, #5a7230, #3d5220);
                color: white;
                border-radius: 10px;
                font-family: &quot;Nunito&quot;, sans-serif;
              "
              id="btnSaveDiet"
            >
              <i class="fa-solid fa-floppy-disk me-1"></i> 식단 기록하기
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/chatbot.js"></script>
  </body>
</html>
